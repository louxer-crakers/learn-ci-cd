name: Test, Build, Push, and Deploy

on: 
  push:
    branches:
      - main

env:
  IMAGE_NAME: ci-cd
  USER_DOCKERHUB: louxercr

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"          

      - name: Install dependencies
        run: |
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: flake8 Run
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --max-complexity=10 --max-line-length=127 --statistics

  build-push:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: |
          echo "${{ secrets.TOKEN }}" | docker login -u ${{ env.USER_DOCKERHUB }} --password-stdin

      - name: Docker build
        run: |
          docker build -t ${{ env.USER_DOCKERHUB }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA} \
          -t ${{ env.USER_DOCKERHUB }}/${{ env.IMAGE_NAME }}:latest .

      - name: Docker push
        run: |
          docker push ${{ env.USER_DOCKERHUB }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}
          docker push ${{ env.USER_DOCKERHUB }}/${{ env.IMAGE_NAME }}:latest

  deployment:
    runs-on: [self-hosted, Windows]
    needs: build-push
    steps:

      - name: Docker Pull
        run: |
          docker pull ${{ env.USER_DOCKERHUB }}/${{ env.IMAGE_NAME }}:latest

      - name: Run
        run: |
          if (docker ps -a -q -f name=app-backup) {
              docker rm -f app-backup
          }

          $hasOldContainer = $false
          if (docker ps -q -f name=app) {
              docker stop app
              docker rename app app-backup
              $hasOldContainer = $true
          }

          docker run -d -p 5000:5000 --name app ${{ env.USER_DOCKERHUB }}/${{ env.IMAGE_NAME }}:latest

          Start-Sleep -Seconds 4

          try {
              $response = Invoke-RestMethod -Uri http://localhost:5000/health -TimeoutSec 5
              if ($response.status -ne "ok") {
                  throw "Status response bukan OK!"
              }
              
              Write-Host "===> DEPLOYMENT SUKSES! Membersihkan backup lama..."
              if ($hasOldContainer) {
                  docker rm -f app-backup
              }
          }
          catch {
              Write-Host "===> HEALTH CHECK GAGAL! Memulai prosedur ROLLBACK..." -ForegroundColor Red
              
              # Hapus kontainer baru yang rusak
              docker rm -f app

              # Kembalikan kontainer lama jika ada
              if ($hasOldContainer) {
                  Write-Host "Menghidupkan kembali kontainer versi sebelumnya..."
                  docker rename app-backup app
                  docker start app
                  Write-Host "Rollback selesai. Sistem kembali ke versi stabil."
              } else {
                  Write-Host "Tidak ada versi sebelumnya untuk di-rollback."
              }

              # Lempar error agar status GitHub Actions tetap merah
              throw "Deployment dibatalkan karena aplikasi gagal health check! Rollback telah dijalankan."
          }