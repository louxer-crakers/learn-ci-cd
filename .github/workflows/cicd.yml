name: Test, Build, Push, and Deploy

on: 
  push:
    branches:
      - main

env:
  IMAGE_NAME: ci-cd
  USER_DOCKERHUB: louxercr

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"          

      - name: Install dependencies
        run: |
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: flake8 Run
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --max-complexity=10 --max-line-length=127 --statistics

  build-push:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: |
          echo "${{ secrets.TOKEN }}" | docker login -u ${{ env.USER_DOCKERHUB }} --password-stdin

      - name: Docker build
        run: |
          docker build -t ${{ env.USER_DOCKERHUB }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA} \
          -t ${{ env.USER_DOCKERHUB }}/${{ env.IMAGE_NAME }}:latest .

      - name: Docker push
        run: |
          docker push ${{ env.USER_DOCKERHUB }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}
          docker push ${{ env.USER_DOCKERHUB }}/${{ env.IMAGE_NAME }}:latest